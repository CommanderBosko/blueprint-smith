[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-smith"
version = "0.1.0"
description = "Generate and validate Factorio 2.0 + Space Age blueprint strings from JSON specs"
requires-python = ">=3.10"
# draftsman 4.x cannot load Factorio 2.0.x data (see CLAUDE.md) — keep below 4.
dependencies = ["factorio-draftsman>=3.3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
blueprint-smith = "blueprint_smith.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The harness mod is copied into each headless run.
"blueprint_smith.harness" = ["mod/*.lua", "mod/*.json"]

[tool.ruff]
extend-exclude = ["spike"]  # throwaway feasibility scripts

[tool.ruff.lint]
# Errors only (undefined names, unused imports and variables, syntax requires-python can't parse), no style
# rules: CI gates on these.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["harness: runs blueprints in the real headless Factorio server (skipped when it isn't installed)"]
